# dsh-ssh-hub bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (SSH engine, /api/dsh-ssh routes, agent tools), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
#
# The row id is `ssh-hub` rather than the upstream `ssh`, so that a profile
# holding both plugins has two distinct rows instead of one silently
# replacing the other. The two share the /api/dsh-ssh route prefix, so only
# one of them may be enabled at a time.
- insert:
    - id: ssh-hub
      name: 'dsh-ssh-hub'

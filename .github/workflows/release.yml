# Version bump, changelog, tag and npm publish — all driven by what actually
# landed on master.
#
# Why one workflow and not two: a GitHub Release created by release-please uses
# the workflow's own GITHUB_TOKEN, and events caused by GITHUB_TOKEN never start
# another workflow. A separate "on: release: published" publisher would look
# correct and silently never run. Publishing therefore lives in this file,
# behind `release_created`, in the same run that makes the release.
#
# The version is never typed by hand. release-please reads Conventional Commits
# since the last tag, computes the next semver, and keeps a single release PR
# updated on every push. Merging that PR is the only manual step, and it is
# deliberate: npm versions are immutable once published, so the last moment a
# mistake is still cheap is the merge button.
#
# `workflow_dispatch` with a tag exists for the one case the push path cannot
# cover: a release whose publish failed. The tag is already cut at that point,
# so re-running the push job would check out the same broken commit. Dispatching
# publishes an existing tag through this same file — which matters, because the
# npm trusted-publisher entry is scoped to the workflow filename `release.yml`.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (empty = just refresh the release PR)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Either the release PR was merged in this run (a new tag exists), or an
    # operator pointed a dispatch at an existing tag.
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release-created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry verifies this run's OIDC identity
      # instead of a long-lived token living in a repo secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch publishes the tag it names; a push publishes what it just
          # tagged, which is the commit this run was started for.
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      # The Node image ships an npm older than the trusted-publishing support
      # (11.5+). Without this the publish authenticates as a stranger and 404s.
      - name: Use an npm that speaks OIDC
        run: npm install --global npm@^11.6.0

      - run: npm ci

      # The same gate as a local `npm run check`, except verify:contrast.
      # That one reads the theme stylesheet out of an *installed* DeepSeek
      # Harness, which a bare runner does not have; it refuses to report a pass
      # it could not measure, so it stays a local gate. Everything below runs
      # anywhere.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:client
      - run: npm run pack:check

      - name: Skip if this version is already on npm
        id: probe
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-ssh-hub@${version}" version >/dev/null 2>&1; then
            echo "dsh-ssh-hub@${version} is already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.probe.outputs.skip == 'false'
        # No --provenance: the registry rejects the attestation with E422
        # ("only public source repositories are supported") while this
        # repository is private. Trusted publishing does not depend on it —
        # the OIDC identity check happens either way. Add the flag back the
        # day the repository goes public; nothing else needs to change.
        run: npm publish --access public
        # If you would rather authenticate with a token than with trusted
        # publishing, add `NPM_TOKEN` to the repository secrets and uncomment:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
